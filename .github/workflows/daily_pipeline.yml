name: Daily Foreclosure Pipeline

on:
  schedule:
    # 10:00 UTC corresponde a las 6:00 AM EST (o 5:00 AM EST en horario de invierno)
    - cron: '0 10 * * *'
  workflow_dispatch:
    # Permite ejecutar el flujo manualmente desde la interfaz de GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Execute Foreclosure Pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SPARK_ACCESS_TOKEN_1: ${{ secrets.SPARK_ACCESS_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_TRACE_API_KEY: ${{ secrets.SKIP_TRACE_API_KEY }}
          SKIP_TRACE_PROVIDER: ${{ secrets.SKIP_TRACE_PROVIDER }}
        run: npx ts-node run_pipeline.ts
