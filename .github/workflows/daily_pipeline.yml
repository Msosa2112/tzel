name: Daily Distress Foreclosure Pipeline

# on:
#   schedule:
#     - cron: '0 14 * * *'
#     - cron: '0 23 * * *'
on:
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub cuando el usuario lo desee

jobs:
  run-pipeline:
    name: Execute Extreme Distress Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Run main orchestrator pipeline
        run: npx ts-node run_pipeline.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SPARK_ACCESS_TOKEN_1: ${{ secrets.SPARK_API_TOKEN }}
          SKIP_TRACE_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
          BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_TRACE_PROVIDER: batchdata
          USE_PROXY: false
