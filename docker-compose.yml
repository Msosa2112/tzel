services:
  redis:
    image: docker.io/redis:alpine
    container_name: redis_local
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tzel-network

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng_local
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=tzel-realestate-osint
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis
    networks:
      - tzel-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr_local
    restart: always
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    networks:
      - tzel-network

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama_local
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tzel-network

  neo4j:
    image: docker.io/neo4j:community
    container_name: neo4j_local
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j_data:/data
    networks:
      - tzel-network

  hister:
    image: ghcr.io/asciimoo/hister:latest
    container_name: hister_local
    restart: always
    ports:
      - "5005:4433"
    volumes:
      - hister_data:/hister/data
    environment:
      - HISTER__SERVER__ADDRESS=0.0.0.0:4433
      - HISTER__SERVER__DATABASE=/hister/data/hister.db
      - HISTER__SEMANTIC_SEARCH__ENABLE=true
      - HISTER__SEMANTIC_SEARCH__EMBEDDING_ENDPOINT=http://ollama:11434/v1/embeddings
      - HISTER__SEMANTIC_SEARCH__EMBEDDING_MODEL=nomic-embed-text
      - HISTER__SEMANTIC_SEARCH__DIMENSIONS=768
      - HISTER__APP__TELEMETRY_ENABLED=false
      - HISTER__APP__LOG_LEVEL=info
    networks:
      - tzel-network
    depends_on:
      - ollama

  crawl4ai_service:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai_local
    restart: always
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - tzel-network

volumes:
  ollama_data:
  neo4j_data:
  hister_data:

networks:
  tzel-network:
    driver: bridge
